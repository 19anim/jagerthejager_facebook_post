name: Jager Facebook Auto Post - NOON

on:
  schedule:
    # 12:07 Vietnam time = 05:07 UTC. Avoid GitHub Actions load spikes at minute 00.
    - cron: "7 5 * * *"
  workflow_dispatch:

jobs:
  post-noon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Restore image selection history
        uses: actions/cache@v4
        with:
          path: .cache/
          key: image-selection-history-noon-${{ github.run_id }}
          restore-keys: |
            image-selection-history-noon-

      - name: Install dependencies
        run: npm ci

      - name: Run Noon Post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_1_ID: ${{ secrets.FB_PAGE_1_ID }}
          FB_PAGE_1_TOKEN: ${{ secrets.FB_PAGE_1_TOKEN }}
          FB_PAGE_2_ID: ${{ secrets.FB_PAGE_2_ID }}
          FB_PAGE_2_TOKEN: ${{ secrets.FB_PAGE_2_TOKEN }}
        run: node facebook-auto-post.js NOON

      - name: Show image selection history
        if: always()
        run: |
          if [ -f .cache/image-selection-history.json ]; then
            cat .cache/image-selection-history.json
          else
            echo "No image selection history found."
          fi

      - name: Upload posts to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: posts-noon-${{ github.run_number }}
          path: posts/
          retention-days: 7
